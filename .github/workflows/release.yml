---
name: Release Process

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: macos-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - uses: pre-commit/action@v3.0.1
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node
      - name: Post-processing - markdownlint MD012
        if: steps.release.outputs.prs_created == 'true'
        run: |
          git fetch origin ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          git checkout ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          pre-commit run markdownlint --files CHANGELOG.md || true
          git add CHANGELOG.md
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --amend --no-edit
            git push --force origin ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          fi
  build-and-publish:
    needs: [release]
    if: needs.release.outputs.release_created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - run: bun run package
      - run: gh release upload ${{ needs.release.outputs.tag_name }} ./*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to Open VSX Registry
        run: bunx ovsx publish ./*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
